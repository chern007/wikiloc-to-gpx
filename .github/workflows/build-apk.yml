name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Make Gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          APK_FILE=$(find android -name "*debug.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found in android directory!"
            find android -name "*.apk"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/wikiloc-to-gpx.apk
          ls -lh build-output/wikiloc-to-gpx.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikiloc-to-gpx-apk
          path: build-output/wikiloc-to-gpx.apk
          retention-days: 30

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/wikiloc-to-gpx.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
